<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Bridge Survey</title>
  <desc id="desc">젊은이교회 5B Bridge 점검 설문조사 링크 미리보기 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.58" stop-color="#f6f2ea"/>
      <stop offset="1" stop-color="#dcefed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1f2a2e" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="92" y="78" width="1016" height="474" rx="22" fill="#fffdf8" stroke="#d9d2c4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="142" y="128" width="92" height="8" rx="4" fill="#176d6a"/>
  <text x="142" y="185" fill="#176d6a" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="30" font-weight="800">젊은이교회 비전연구소</text>
  <text x="142" y="284" fill="#1f2a2e" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="86" font-weight="900">Bridge Survey</text>
  <text x="142" y="348" fill="#176d6a" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="39" font-weight="800">너와 나의 연결 다리, 이건 우리 안에 소망</text>
  <text x="142" y="426" fill="#66777d" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="29" font-weight="700">문항수 14~19개 · 예상 소요 시간 5~10분</text>
  <text x="142" y="476" fill="#0f4f50" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="28" font-weight="800">젊은이교회 5B, Bridge 점검 설문조사</text>
</svg>
