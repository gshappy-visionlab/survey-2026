<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bridge Survey</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="cover-panel" id="cover-view">
        <p class="kicker">Bridge Survey</p>
        <h1>젊은이교회 5B,<br />Bridge 점검 설문조사</h1>
        <p class="cover-subtitle">너와 나의 연결 다리, 이건 우리 안에 소망</p>
        <blockquote class="cover-verse">
          <span>[벧전3:15]</span>
          너희 마음에 그리스도를 주로 삼아 거룩하게 하고 너희 속에 있는 소망에 관한 이유를 묻는 자에게는 대답할 것을 항상 준비하되 온유와 두려움으로 하고
        </blockquote>
        <button class="primary-btn cover-start" id="start-btn" type="button">입장</button>
      </section>

      <section class="survey-panel hidden" id="survey-view">
        <header class="survey-header">
          <p class="kicker">Bridge Survey</p>
          <h1>나의 복음과 비전 돌아보기</h1>
          <div class="progress-wrap" aria-label="설문 진행률">
            <div class="progress-bar">
              <span id="progress-fill"></span>
            </div>
            <span id="progress-text">0%</span>
          </div>
        </header>

        <section class="question-card">
          <h2 id="question-title"></h2>
          <p class="question-help" id="question-help"></p>
          <form id="answer-form" class="answer-form"></form>
          <p class="form-error" id="form-error" role="alert"></p>
        </section>

        <footer class="nav-actions">
          <button class="ghost-btn" id="back-btn" type="button">이전</button>
          <button class="primary-btn" id="next-btn" type="button">다음</button>
        </footer>
      </section>

      <section class="result-panel hidden" id="result-view">
        <p class="kicker">Survey Result</p>
        <h1 id="result-title"></h1>
        <p id="result-copy"></p>
        <div class="result-box">
          <h2>다음 걸음</h2>
          <ul id="result-actions"></ul>
        </div>
        <button class="primary-btn" id="restart-btn" type="button">처음부터 다시하기</button>
      </section>
    </main>

    <script src="./config.js?v=20260613-bridge-cover"></script>
    <script src="./app.js?v=20260613-bridge-cover"></script>
  </body>
</html>
